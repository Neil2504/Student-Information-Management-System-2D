<!DOCTYPE html>
<html>
<head>
    <title>SIMS Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eeecfc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #080b2b;
        }

        .login-container {
            background-color: white;
            width: 390px;
            padding: 28px 40px 48px;
            border: 1px solid #55549a;
            border-radius: 16px;
            text-align: center;
        }

        h1 {
            font-size: 25px;
            line-height: 1.15;
            font-weight: bold;
            margin: 0 0 38px;
        }

        h2 {
            display: none;
        }

        .description {
            color: #222;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .input-group {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #ddd;
            margin-bottom: 18px;
            padding: 8px 0;
        }

        .input-group span {
            font-size: 19px;
            width: 30px;
            text-align: left;
        }

        .input-group input {
            border: none;
            outline: none;
            width: 100%;
            padding: 7px 5px;
            font-size: 14px;
            background: transparent;
        }

        .input-group:focus-within {
            border-bottom: 2px solid #073bff;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 23px;
            background-color: #083bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background-color: #002bd1;
        }

        #message {
            font-size: 13px;
            margin-top: 15px;
        }

        #forgotPassword {
            display: inline-block;
            margin-top: 12px;
            font-size: 12px;
            color: #083bff;
            text-decoration: none;
        }

        #forgotPassword:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-container {
                width: calc(100% - 32px);
                padding: 28px 24px 35px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>
            Manggahan High School<br> <br>Student Information<br>
            Management System
        </h1>

        <p class="description">
            Please enter your credentials to continue
        </p>

        <form id="loginForm">

            <div class="input-group">
                <span>♙</span>
                <input type="text" id="username"
                       placeholder="Username" required>
            </div>

            <div class="input-group">
                <span>♙</span>
                <input type="password" id="password"
                       placeholder="Password" required>
            </div>

            <button type="submit">LOGIN</button>

        </form>

        <p id="message"></p>

        <a href="#" id="forgotPassword">Forgot password?</a>

    </div>

    <script>

        let users = [
            {
                "username": "Ferdie",
                "password": "12345"
            },
            {
                "username": "Niruu",
                "password": "12345"
            }
        ];

        const loginForm = document.getElementById("loginForm");

        loginForm.addEventListener("submit", function(event) {

            event.preventDefault();

            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;

            let foundUser = users.find(function(user) {

                return user.username === username &&
                       user.password === password;

            });

            if (foundUser) {

                document.getElementById("message").style.color = "green";
                document.getElementById("message").innerHTML =
                    "Login successful!";

                window.location.href = "";

            } else {

                document.getElementById("message").style.color = "red";
                document.getElementById("message").innerHTML =
                    "Incorrect username or password.";

            }

        });

        document.getElementById("forgotPassword")
            .addEventListener("click", function(event) {

                event.preventDefault();

                alert("Please contact the school administrator to reset your password.");

            });

    </script>

</body>
</html>
